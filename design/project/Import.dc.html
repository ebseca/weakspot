<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bring in the reply</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
body { margin: 0; background: #15171C; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
a { color: #5468C4; text-decoration: none; }
a:hover { color: #6E82D8; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #E7EAF1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 28px 22px 16px 22px;">
    <a href="Create.dc.html" aria-label="Back to prompt" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8D95A6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>
    </a>
    <div style="font-size: 20px; font-weight: 600;">Bring in the reply</div>
  </div>

  <div style="padding: 0 22px 14px 22px; display: flex; gap: 6px; background: transparent;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{isPaste}}" hint-placeholder-val="{{true}}">
    <div style="padding: 0 22px; display: flex; flex-direction: column; gap: 7px;">
      <label for="payload" style="font-size: 13px; color: #8D95A6;">Paste everything the AI replied — extra chatter is ignored.</label>
      <textarea id="payload" rows="7" style="box-sizing: border-box; width: 100%; resize: none; padding: 13px; border-radius: 12px; background: #12141A; border: 1px solid #2D323E; color: #98A0B0; font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.55;">{"deck":"Hiragana","cards":[
  {"front":"あ","back":"a"},
  {"front":"い","back":"i"},
  {"front":"ぬ","back":"nu","hint":"No vertical spine","distractors":["ne","me","wa"]},
  {"front":"ね","back":"ne","hint":"Vertical spine, then loop"},
  ...</textarea>
    </div>
  </sc-if>

  <sc-if value="{{isFile}}" hint-placeholder-val="{{true}}">
    <div style="padding: 0 22px; display: flex; flex-direction: column; gap: 7px;">
      <label for="picker" style="font-size: 13px; color: #8D95A6;">For replies too long to paste on a phone.</label>
      <div style="box-sizing: border-box; height: 148px; border-radius: 12px; background: #12141A; border: 1px dashed #39404F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5468C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path></svg>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #B6BDCB;">hiragana.json</div>
        <label for="picker" style="font-size: 12px; color: #5468C4; cursor: pointer;">Choose a different file</label>
        <input id="picker" type="file" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;">
      </div>
    </div>
  </sc-if>

  <div style="padding: 16px 22px 0 22px; display: flex; flex-direction: column; gap: 10px;">

    <div style="border-radius: 13px; background: #1E2A24; border: 1px solid #2F5244; padding: 15px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="#5FA37F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M3 8.5l3.3 3.3L13 5"></path></svg>
        <span style="font-size: 15px; font-weight: 600; color: #E7EAF1;">Hiragana — ready to create</span>
      </div>
      <div style="display: flex; gap: 0;">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: #7FC9A2;">{{c.n}}</span>
            <span style="font-size: 11px; color: #8D95A6;">{{c.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="border-radius: 13px; background: #2A2419; border: 1px solid #5A4A28; padding: 14px 16px; display: flex; gap: 11px; align-items: flex-start;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#D7A13F" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M8 1.6L14.8 13.4H1.2z"></path><path d="M8 6.4v3M8 11.4v.1"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 13px; font-weight: 600; color: #E8C983;">2 cards skipped</span>
        <span style="font-size: 12.5px; line-height: 1.45; color: #B6BDCB;">Card 31 has no <span style="font-family: 'IBM Plex Mono', monospace;">back</span>. Card 38 repeats <span style="font-family: 'IBM Plex Mono', monospace;">front</span> &quot;や&quot;. The other 46 are fine.</span>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 14px 22px 26px 22px; display: flex; flex-direction: column; gap: 9px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; padding: 17px; border-radius: 13px; background: #5468C4; color: #FFFFFF; font-size: 16px; font-weight: 600;">Create library with 46 cards</a>
    <a href="Create.dc.html" style="text-align: center; font-size: 13px; color: #8D95A6;">Fix the reply and try again</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'paste' };
  }
  tabStyle(on) {
    return 'flex-grow: 1; padding: 11px; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; '
      + (on
        ? 'background: #232842; border: 1px solid #5468C4; color: #E7EAF1;'
        : 'background: #1A1D25; border: 1px solid #2D323E; color: #8D95A6;');
  }
  renderVals() {
    const tab = this.state.tab;
    return {
      isPaste: tab === 'paste',
      isFile: tab === 'file',
      tabs: [
        { id: 'paste', label: 'Paste text' },
        { id: 'file', label: 'Import a file' }
      ].map((t) => ({
        label: t.label,
        style: this.tabStyle(tab === t.id),
        pick: () => this.setState({ tab: t.id })
      })),
      counts: [
        { n: '46', label: 'cards' },
        { n: '31', label: 'with hints' },
        { n: '12', label: 'with distractors' }
      ]
    };
  }
}
</script>
</body>
</html>
