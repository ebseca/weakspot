<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
body { margin: 0; background: #15171C; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
a { color: #5468C4; text-decoration: none; }
a:hover { color: #6E82D8; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #E7EAF1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 28px 22px 0 22px;">
    <a href="Main.dc.html" aria-label="End session" style="width: 40px; height: 40px; margin-left: -10px; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8D95A6" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #262A35; overflow: hidden;">
      <div style="width: 35%; height: 100%; background: #5468C4; border-radius: 3px;"></div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8D95A6;">7/20</div>
  </div>

  <div style="display: flex; justify-content: center; padding: 22px 22px 0 22px;">
    <div style="display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 20px; background: #1E212A; border: 1px solid #2D323E;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5468C4;">→</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #8D95A6;">READING</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 18px 22px;">
    <div style="width: 100%; height: 230px; border-radius: 18px; background: #F5F2E9; display: flex; align-items: center; justify-content: center;">
      <span style="font-family: 'Noto Sans JP', 'IBM Plex Sans', sans-serif; font-size: 128px; line-height: 1; color: #1A1C22;">ね</span>
    </div>
  </div>

  <div style="padding: 0 22px 26px 22px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 13px; color: #8D95A6; text-align: center; padding-bottom: 4px;">Which sound is this?</div>
    <sc-for list="{{options}}" as="opt" hint-placeholder-count="4">
      <a href="{{opt.href}}" style="display: flex; align-items: center; justify-content: center; padding: 18px; border-radius: 13px; background: #1E212A; border: 1px solid #2D323E; color: #E7EAF1; font-size: 18px; font-weight: 500;">{{opt.label}}</a>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        { label: 'no', href: 'RevealWrong.dc.html' },
        { label: 'ne', href: 'RevealRight.dc.html' },
        { label: 'na', href: 'RevealWrong.dc.html' },
        { label: 'nu', href: 'RevealWrong.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
