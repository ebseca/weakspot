<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
body { margin: 0; background: #15171C; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
a { color: #5468C4; text-decoration: none; }
a:hover { color: #6E82D8; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #E7EAF1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 26px 22px 0 22px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: #8D95A6;">SESSION COMPLETE</div>
      <div style="font-size: 21px; font-weight: 600;">Hiragana · reading</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 2px; font-family: 'IBM Plex Mono', monospace;">
      <span style="font-size: 32px; font-weight: 600; color: #5FA37F;">16</span>
      <span style="font-size: 17px; color: #8D95A6;">/20</span>
    </div>
  </div>

  <div style="padding: 16px 22px 0 22px; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 13px; color: #B6BDCB;">な row — clear 70% on all five to unlock は</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #C9633C;">48%</span>
    </div>
    <div style="height: 7px; border-radius: 4px; background: #262A35; overflow: hidden; position: relative;">
      <div style="width: 48%; height: 100%; background: #C9633C; border-radius: 4px;"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #5FA37F;">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#5FA37F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.3 3.3L13 5"></path></svg>
      て and と reached mastered this session
    </div>
  </div>

  <div style="padding: 20px 22px 8px 22px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: #8D95A6;">ALL 46 CHARACTERS</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8D95A6;">25 unlocked</span>
  </div>

  <div style="padding: 0 22px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="46">
      <div style="{{t.style}}">
        <span style="font-family: 'Noto Sans JP', sans-serif; font-size: 21px; line-height: 1;">{{t.ch}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 22px 0 22px; display: flex; flex-wrap: wrap; gap: 10px 14px;">
    <sc-for list="{{legend}}" as="l" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="width: 9px; height: 9px; border-radius: 2px; background: {{l.color}};"></span>
        <span style="font-size: 11px; color: #8D95A6;">{{l.label}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 14px 22px 26px 22px; display: flex; gap: 10px;">
    <a href="Stats.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 13px; background: #1E212A; border: 1px solid #2D323E; color: #E7EAF1; font-size: 15px; font-weight: 600;">See weak spots</a>
    <a href="Session.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 13px; background: #5468C4; color: #FFFFFF; font-size: 15px; font-weight: 600;">Go again</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chars = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん'];
    const bands = {
      mastered: { bg: '#5FA37F', fg: '#15171C', border: '#5FA37F' },
      learning: { bg: '#D7A13F', fg: '#15171C', border: '#D7A13F' },
      weak:     { bg: '#C9633C', fg: '#15171C', border: '#C9633C' },
      fresh:    { bg: '#1B1E26', fg: '#454C5C', border: '#272B35' }
    };
    const bandFor = (i) => {
      if (i <= 7 || i === 18 || i === 19) return 'mastered';
      if (i <= 17) return 'learning';
      if (i <= 24) return 'weak';
      return 'fresh';
    };
    return {
      tiles: chars.map((ch, i) => {
        const b = bands[bandFor(i)];
        return {
          ch: ch,
          style: 'height: 46px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: '
            + b.bg + '; color: ' + b.fg + '; border: 1px solid ' + b.border + ';'
        };
      }),
      legend: [
        { color: '#5FA37F', label: 'Mastered · 90%+' },
        { color: '#D7A13F', label: 'Learning · 50–89%' },
        { color: '#C9633C', label: 'Struggling · under 50%' },
        { color: '#272B35', label: 'Locked' }
      ]
    };
  }
}
</script>
</body>
</html>
