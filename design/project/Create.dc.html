<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create a library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
body { margin: 0; background: #15171C; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
a { color: #5468C4; text-decoration: none; }
a:hover { color: #6E82D8; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #E7EAF1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 28px 22px 16px 22px;">
    <a href="Main.dc.html" aria-label="Back to libraries" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#8D95A6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>
    </a>
    <div style="font-size: 20px; font-weight: 600;">New library</div>
  </div>

  <div style="padding: 0 22px; display: flex; flex-direction: column; gap: 9px;">
    <label for="topic" style="font-size: 14px; color: #B6BDCB;">What do you want to learn?</label>
    <textarea id="topic" rows="2" style="box-sizing: border-box; width: 100%; resize: none; padding: 14px; border-radius: 12px; background: #1E212A; border: 1px solid #2D323E; color: #E7EAF1; font-family: inherit; font-size: 15px; line-height: 1.4;">I would like to learn hiragana</textarea>
  </div>

  <div style="padding: 14px 22px 0 22px;">
    <button type="button" onClick="{{copy}}" style="{{copyStyle}}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"></rect><path d="M10.5 3.5h-7a1 1 0 00-1 1v7"></path></svg>
      {{copyLabel}}
    </button>
  </div>

  <div style="padding: 16px 22px 12px 22px; display: flex; flex-direction: column; gap: 9px;">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: flex-start; gap: 11px;">
        <span style="flex-shrink: 0; width: 20px; height: 20px; border-radius: 10px; background: #262A35; color: #8D95A6; font-family: 'IBM Plex Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center; margin-top: 1px;">{{s.n}}</span>
        <span style="font-size: 13px; line-height: 1.45; color: #B6BDCB;">{{s.text}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 4px 22px 8px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: #8D95A6;">WHAT GETS COPIED</div>

  <div style="flex-grow: 1; margin: 0 22px; padding: 14px; border-radius: 12px; background: #12141A; border: 1px solid #22262F; overflow-y: auto; overflow-x: auto;">
    <pre style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; line-height: 1.6; color: #98A0B0; white-space: pre;">{{promptText}}</pre>
  </div>

  <div style="padding: 14px 22px 26px 22px;">
    <a href="Import.dc.html" style="display: flex; align-items: center; justify-content: center; padding: 17px; border-radius: 13px; background: #1E212A; border: 1px solid #2D323E; color: #E7EAF1; font-size: 15px; font-weight: 600;">I have the reply — bring it in</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false };
  }
  promptText() {
    return [
      'You are helping build a flashcard deck.',
      '',
      'Topic: I would like to learn hiragana',
      '',
      'Produce the COMPLETE natural set for this',
      'topic. If the topic has no naturally bounded',
      'set, produce the 20-30 most useful items.',
      '',
      'Reply with ONLY this JSON. No commentary,',
      'no markdown fences:',
      '',
      '{',
      '  "deck": "<short name>",',
      '  "cards": [',
      '    {',
      '      "front": "<prompt side>",',
      '      "back":  "<answer side>",',
      '      "hint":  "<optional memory aid>",',
      '      "distractors": ["<wrong>", "<wrong>"]',
      '    }',
      '  ]',
      '}',
      '',
      'Rules:',
      '- front and back stay short. No sentences.',
      '- hint is optional. Use it only for',
      '  look-alikes that are easy to confuse.',
      '- distractors are optional. Include them',
      '  only when a specific wrong answer is',
      '  genuinely confusable with the right one.'
    ].join('\n');
  }
  renderVals() {
    const copied = this.state.copied;
    return {
      promptText: this.promptText(),
      copyLabel: copied ? 'Copied to clipboard' : 'Copy prompt',
      copyStyle: 'width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border-radius: 13px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; border: 1px solid '
        + (copied ? '#5FA37F; background: #1E2A24; color: #7FC9A2;' : '#5468C4; background: #5468C4; color: #FFFFFF;'),
      copy: () => {
        try {
          if (navigator.clipboard) { navigator.clipboard.writeText(this.promptText()); }
        } catch (e) { /* clipboard unavailable in preview */ }
        this.setState({ copied: true });
        setTimeout(() => this.setState({ copied: false }), 2000);
      },
      steps: [
        { n: '1', text: 'Copy the prompt.' },
        { n: '2', text: 'Paste it into whatever AI you already use — nothing is sent from this app.' },
        { n: '3', text: 'Copy the reply back here, or save it as a file and import it.' }
      ]
    };
  }
}
</script>
</body>
</html>
