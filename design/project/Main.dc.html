<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your libraries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
body { margin: 0; background: #15171C; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
a { color: #5468C4; text-decoration: none; }
a:hover { color: #6E82D8; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #E7EAF1; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 22px 18px 22px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 23px; font-weight: 700; letter-spacing: -0.4px;">Weakspot</div>
      <div style="font-size: 12px; color: #8D95A6;">Everything stays on this device</div>
    </div>
    <a href="Create.dc.html" aria-label="How deck creation works" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2D323E; display: flex; align-items: center; justify-content: center; color: #8D95A6; font-size: 17px; font-weight: 600;">?</a>
  </div>

  <div style="padding: 0 22px 10px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.2px; color: #8D95A6;">YOUR LIBRARIES</div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 22px; overflow: hidden;">

    <sc-for list="{{libraries}}" as="lib" hint-placeholder-count="3">
      <a href="{{lib.href}}" style="display: block; background: #1E212A; border: 1px solid #2D323E; border-radius: 14px; padding: 16px 16px 14px 16px; color: #E7EAF1;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="font-size: 17px; font-weight: 600;">{{lib.name}}</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8D95A6;">{{lib.notes}} notes</div>
        </div>
        <div style="margin-top: 4px; font-size: 13px; color: #8D95A6;">{{lib.status}}</div>
        <div style="margin-top: 12px; display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #262A35;">
          <div style="width: {{lib.wMastered}}; background: #5FA37F;"></div>
          <div style="width: {{lib.wLearning}}; background: #D7A13F;"></div>
          <div style="width: {{lib.wWeak}}; background: #C9633C;"></div>
          <div style="width: {{lib.wNew}}; background: #39404F;"></div>
        </div>
        <div style="margin-top: 9px; display: flex; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8D95A6;">
          <span style="color: #5FA37F;">{{lib.mastered}} mastered</span>
          <span style="color: #D7A13F;">{{lib.learning}} learning</span>
          <span style="color: #C9633C;">{{lib.weak}} weak</span>
        </div>
      </a>
    </sc-for>

    <a href="Create.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 9px; border: 1px dashed #39404F; border-radius: 14px; padding: 17px; color: #8D95A6; font-size: 15px; font-weight: 500;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8D95A6" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
      Create a library
    </a>

  </div>

  <div style="padding: 16px 22px 26px 22px;">
    <a href="Stats.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-radius: 12px; background: #1A1D25; border: 1px solid #2D323E; color: #E7EAF1;">
      <span style="font-size: 14px; font-weight: 500;">Progress &amp; weak spots</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8D95A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg>
    </a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      libraries: [
        {
          name: 'Hiragana', notes: 46, href: 'Session.dc.html',
          status: '25 of 46 unlocked · studied today',
          mastered: 10, learning: 10, weak: 5,
          wMastered: '22%', wLearning: '22%', wWeak: '11%', wNew: '45%'
        },
        {
          name: 'Katakana', notes: 46, href: 'Session.dc.html',
          status: 'Not started — pool opens at 5 cards',
          mastered: 0, learning: 0, weak: 0,
          wMastered: '0%', wLearning: '0%', wWeak: '0%', wNew: '100%'
        },
        {
          name: 'Thai consonants', notes: 44, href: 'Session.dc.html',
          status: 'Made by you · 3 of 44 unlocked',
          mastered: 0, learning: 2, weak: 1,
          wMastered: '0%', wLearning: '5%', wWeak: '2%', wNew: '93%'
        }
      ]
    };
  }
}
</script>
</body>
</html>
